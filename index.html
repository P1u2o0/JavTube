<!--
  @file index.html
  @module 根HTML入口
  @description JavTube 应用的根 HTML 文件，由 Vite 作为入口模板使用。
               定义了文档类型、语言、字符编码、视口和标题等基本元信息，
               并通过 ES Module 方式加载前端入口脚本 src/main.js。
  @dependencies src/main.js (Vue 渲染进程入口)
-->
<!DOCTYPE html>
<!-- 语言设为简体中文 -->
<html lang="zh-CN">
  <head>
    <!-- 字符编码设为 UTF-8，支持多语言字符 -->
    <meta charset="UTF-8" />
    <!-- 视口设置：适配不同设备宽度，初始缩放为 1.0 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题，显示在窗口标题栏 -->
    <title>JavTube</title>
    <!-- 字体：Outfit（拉丁展示字）+ Noto Sans SC（中文正文），离线时回退系统字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Vue 应用挂载点：Vue 实例会挂载到 id="app" 的 DOM 元素上 -->
    <div id="app"></div>
    <!-- 以 ES Module 方式加载前端入口脚本 -->
    <!-- Vite 会将此入口作为构建起点，编译并打包所有依赖 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
