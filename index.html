<!--
  @file index.html
  @module 根HTML入口
  @description JavTube 应用的根 HTML 文件，由 Vite 作为入口模板使用。
               定义了文档类型、语言、字符编码、视口和标题等基本元信息，
               并通过 ES Module 方式加载前端入口脚本 src/main.js。
  @dependencies src/main.js (Vue 渲染进程入口)
-->
<!DOCTYPE html>
<!-- 语言设为简体中文 -->
<html lang="zh-CN">
  <head>
    <!-- 字符编码设为 UTF-8，支持多语言字符 -->
    <meta charset="UTF-8" />
    <!-- 内容安全策略：消除 Electron 的 Insecure Content-Security-Policy 警告。
         仅允许加载本应用自身资源；封面为本地文件/https 图片；
         开发模式需保留 ws/wss 与 localhost 以支撑 Vite 热更新。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               img-src 'self' data: file: blob: http: https: javtube-cover:;
               connect-src 'self' ws: wss: http: https:;"
    />
    <!-- 视口设置：适配不同设备宽度，初始缩放为 1.0 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 页面标题，显示在窗口标题栏 -->
    <title>JavTube</title>
    <!-- 字体：Inter（拉丁，本地托管于 src/assets/fonts）+ 系统中文（苹方/微软雅黑），离线可用 -->
  </head>
  <body>
    <!-- Vue 应用挂载点：Vue 实例会挂载到 id="app" 的 DOM 元素上 -->
    <div id="app"></div>
    <!-- 以 ES Module 方式加载前端入口脚本 -->
    <!-- Vite 会将此入口作为构建起点，编译并打包所有依赖 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
